[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
# No external dependencies: the contracts are fully self-contained so the
# deployed bytecode is easy to audit and verify on BscScan.

[etherscan]
# Used only by the optional `forge verify-contract` flow described in the
# README. No API key is stored in this repository.
